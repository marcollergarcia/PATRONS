    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'IBM Plex Sans Condensed', sans-serif;
      font-optical-sizing: auto;
      background: #ffffff;
      padding: 0;
      color: #1d1d1f;
      line-height: 1.47059;
      font-weight: 400;
      letter-spacing: -0.022em;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 20px 40px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 4px;
      font-size: 32px;
      line-height: 1.125;
      font-weight: 600;
      letter-spacing: -0.003em;
      color: #1d1d1f;
    }
    
    .subtitle {
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 400;
      letter-spacing: 0.011em;
      color: #6e6e73;
      margin-bottom: 20px;
    }
    
    
    .editor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    
    .card {
      background: #fbfbfd;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #d2d2d7;
    }
    
    .card.editada {
      border: 2px solid #000000;
      background: #ffffff;
    }

    .card-media {
      position: relative;
      background: #ffffff;
    }

    .card-status-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      min-width: 26px;
      height: 26px;
      padding: 0 7px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      pointer-events: none;
      user-select: none;
    }

    .card-status-badge.completa {
      background: #34c759;
      color: #ffffff;
    }

    .card-status-badge.pendent {
      background: #ff9500;
      color: #ffffff;
    }
    
    .card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      background: #ffffff;
      display: block;
      cursor: pointer;
    }
    
    .card-info {
      padding: 12px;
    }
    
    .nom-fitxer {
      font-size: 10px;
      color: #86868b;
      margin-bottom: 10px;
      word-break: break-all;
      font-weight: 400;
    }

    .data-completada {
      font-size: 10px;
      color: #34c759;
      margin-top: 8px;
      margin-bottom: 0;
      line-height: 1.35;
      font-weight: 500;
    }
    
    .form-group {
      margin-bottom: 4px;
    }
    
    .form-group label {
      display: block;
      font-size: 11px;
      color: #6e6e73;
      margin-bottom: 2px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    
    .form-group input {
      width: 100%;
      padding: 4px 8px;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      font-size: 13px;
      color: #1d1d1f;
      background: #ffffff;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #000000;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
    }

    .form-group select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      font-size: 13px;
      color: #1d1d1f;
      background: #ffffff;
      transition: all 0.2s ease;
      font-family: 'IBM Plex Sans Condensed', sans-serif;
      cursor: pointer;
    }

    .form-group select:focus {
      outline: none;
      border-color: #000000;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1);
    }
    
    .save-status {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #000000;
      color: white;
      padding: 12px 24px;
      border-radius: 20px;
      display: none;
      z-index: 1000;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }
    
    .paginacio {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 20px 0;
      flex-wrap: wrap;
    }
    
    .paginacio button {
      font-family: 'IBM Plex Sans Condensed', sans-serif;
      font-optical-sizing: auto;
      padding: 6px 12px;
      min-width: 36px;
      border: 1px solid #d2d2d7;
      background: #fbfbfd;
      cursor: pointer;
      border-radius: 6px;
      font-size: 13px;
      color: #1d1d1f;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    
    .paginacio button:hover:not(:disabled) {
      background: #f5f5f7;
      border-color: #000000;
    }
    
    .paginacio button.actiu {
      background: #000000;
      color: white;
      border-color: #000000;
    }
    
    .paginacio button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .pag-ellipsis {
      padding: 6px 4px;
      font-size: 13px;
      color: #86868b;
      display: inline-flex;
      align-items: center;
      user-select: none;
    }
    
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      justify-content: center;
      align-items: center;
    }
    
    .modal img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }
    
    .modal.actiu { display: flex; }
    
    .filter-dropdown {
      position: relative;
      display: inline-flex;
    }
    
    .filter-button {
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      font-family: inherit;
      color: #1d1d1f;
    }
    
    .filter-button:hover {
      border-color: #000000;
      background: #f5f5f7;
    }
    
    .filter-button .arrow {
      font-size: 10px;
      transition: transform 0.2s;
    }
    
    .filter-button.open .arrow {
      transform: rotate(180deg);
    }
    
    .filter-menu {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 4px;
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      min-width: 320px;
      max-height: 450px;
      overflow: hidden;
      z-index: 1000;
      display: none;
    }
    
    .filter-menu.open {
      display: block;
    }
    
    .filter-search {
      padding: 12px;
      border-bottom: 1px solid #d2d2d7;
    }
    
    .filter-search input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d2d2d7;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
    }
    
    .filter-search input:focus {
      outline: none;
      border-color: #000000;
    }
    
    .filter-actions {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #d2d2d7;
    }
    
    .filter-actions button {
      flex: 1;
      padding: 6px 12px;
      background: #f5f5f7;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      color: #1d1d1f;
    }
    
    .filter-actions button:hover {
      background: #e8e8e8;
    }
    
    .filter-options {
      max-height: 300px;
      overflow-y: auto;
      padding: 4px;
    }
    
    .filter-option {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.2s;
    }
    
    .filter-option:hover {
      background: #f5f5f7;
    }
    
    .filter-option input[type="checkbox"] {
      margin-right: 10px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    
    .filter-option label {
      flex: 1;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .filter-option .count {
      color: #86868b;
      font-size: 11px;
      margin-left: 8px;
    }

    /* ── Capçalera enganxosa ── */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid #d2d2d7;
      box-shadow: 0 1px 8px rgba(0,0,0,0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 10px 20px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .header-title-row {
      text-align: center;
      width: 100%;
    }

    .header-title-row h1 {
      font-family: 'Port Lligat Sans', sans-serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #1d1d1f;
      margin: 0;
      line-height: 1.25;
    }

    .header-title-row .subtitle-sep {
      font-weight: 400;
      color: #b0b0b5;
      margin: 0 6px;
    }

    .header-title-row .subtitle {
      font-size: 15px;
      font-weight: 400;
      color: #6e6e73;
    }

    .header-controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .header-progress-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
      max-width: 560px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #e5e5ea;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #34c759;
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .progress-label {
      font-size: 11px;
      color: #86868b;
    }

    .header-sep {
      width: 1px;
      height: 20px;
      background: #d2d2d7;
      flex-shrink: 0;
    }

    .header-filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Filtre per grups (Tots els grups) ocult; la lògica segueix amb tots els grups actius */
    .header-filters > .filter-dropdown:first-of-type {
      display: none !important;
    }

    .admin-menu-wrap {
      position: absolute;
      top: 8px;
      right: 12px;
    }

    .admin-trigger {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #c7c7cc;
      padding: 4px;
      line-height: 1;
      transition: color 0.2s;
    }

    .admin-trigger:hover {
      color: #86868b;
    }

    .admin-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 4px;
      background: #ffffff;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      overflow: hidden;
      min-width: 160px;
      z-index: 200;
    }

    .admin-menu.open {
      display: block;
    }

    .admin-menu button {
      display: block;
      width: 100%;
      padding: 10px 16px;
      background: none;
      border: none;
      text-align: left;
      font-size: 13px;
      font-family: inherit;
      color: #1d1d1f;
      cursor: pointer;
      transition: background 0.15s;
    }

    .admin-menu button:hover {
      background: #f5f5f7;
    }

    .container {
      padding-top: 16px;
    }

    .site-footer {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 20px 36px;
      text-align: center;
      font-size: 12px;
      color: #86868b;
      border-top: 1px solid #d2d2d7;
      line-height: 1.4;
    }

    .site-footer p {
      margin: 0;
    }

    .site-footer a {
      color: #6e6e73;
      text-decoration: none;
    }

    .site-footer a:hover {
      color: #1d1d1f;
      text-decoration: underline;
    }

        </div>

        </div>

      </div>
    </div>

    <div class="admin-menu-wrap">
      <button class="admin-trigger" id="adminTrigger" onclick="toggleAdminMenu()" title="Administrador">⚙</button>
      <div class="admin-menu" id="adminMenu">
        <button onclick="exportarCSV(); toggleAdminMenu()">💾 Exportar CSV</button>
        <button onclick="importarCSV(); toggleAdminMenu()">📥 Importar CSV</button>
      </div>
    </div>
  </header>

    function exportarCSV() {
      const BOM = '\uFEFF';
      let csv = BOM + 'NOMFITXER;Tècnica;Autor;Any;Mida;Motiu;DataCompletada\n';
      
      PATRONS.forEach(p => {
        const dc = (p.dataCompletada || '').replace(/\r?\n/g, ' ').trim();
        csv += `${p.nom};${p.tecnica || ''};${p.autor || ''};${p.any || ''};${p.mida || ''};${p.motiu || ''};${dc}\n`;
      });
      
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      const ara = new Date();
      const pad = n => String(n).padStart(2, '0');
      const stamp = `${ara.getFullYear()}-${pad(ara.getMonth() + 1)}-${pad(ara.getDate())}_${pad(ara.getHours())}-${pad(ara.getMinutes())}`;
      link.download = `resultat_${stamp}.csv`;
      link.click();
      mostrarGuardat('CSV exportat');
    }
    
    function normalitzarClauCapçalera(raw) {
      return String(raw || '')
        .replace(/^\uFEFF/, '')
        .trim()
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '');
    }

    /**
     * Retorna índexs per columna segons la primera línia, o null si no sembla capçalera.
     * Compatible amb v3 (sense Col·lecció) i amb CSV d'editor.html (amb Col·lecció).
     */
    function parseCapçaleraCSV(primeraLinia) {
      const parts = primeraLinia.replace(/^\uFEFF/, '').split(';');
      const idx = {};
      parts.forEach(function (raw, i) {
        const k = normalitzarClauCapçalera(raw);
        if (k === 'nomfitxer' || k === 'nom') idx.nom = i;
        else if (k === 'tecnica') idx.tecnica = i;
        else if (k === 'autor') idx.autor = i;
        else if (k === 'any') idx.any = i;
        else if (k === 'colleccio') idx.colleccio = i;
        else if (k === 'mida') idx.mida = i;
        else if (k === 'motiu') idx.motiu = i;
        else if (k === 'datacompletada') idx.dataCompletada = i;
      });
      if (idx.nom === undefined) return null;
      return idx;
    }

    function valorCSVColumna(parts, idx, clau) {
      const i = idx[clau];
      if (i === undefined) return '';
      const v = parts[i];
      return v != null ? String(v).replace(/\r$/, '').trim() : '';
    }

    function importarCSV() {
      const fileInput = document.getElementById('fileInput');
      fileInput.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const content = event.target.result;
            const liniesCompletes = content.split('\n');
            let idx = parseCapçaleraCSV(liniesCompletes[0] || '');
            let linies;
            if (idx) {
              linies = liniesCompletes.slice(1);
            } else {
              idx = {
                nom: 0,
                tecnica: 1,
                autor: 2,
                any: 3,
                mida: 4,
                motiu: 5,
                dataCompletada: 6
              };
              linies = liniesCompletes;
            }

            let importades = 0;
            linies.forEach(function (linia) {
              if (!linia.trim()) return;
              const parts = linia.split(';');
              const nom = valorCSVColumna(parts, idx, 'nom');
              if (!nom) return;
              const patro = PATRONS.find(p => p.nom === nom);
              if (patro) {
                patro.tecnica = valorCSVColumna(parts, idx, 'tecnica');
                patro.autor = valorCSVColumna(parts, idx, 'autor');
                patro.any = valorCSVColumna(parts, idx, 'any');
                if (idx.colleccio !== undefined) {
                  patro.colleccio = valorCSVColumna(parts, idx, 'colleccio');
                }
                patro.mida = valorCSVColumna(parts, idx, 'mida');
                patro.motiu = valorCSVColumna(parts, idx, 'motiu');
                patro.dataCompletada = valorCSVColumna(parts, idx, 'dataCompletada');
                if (patroTeDadesRelevant(patro)) {
                  importades++;
                }
              }
            });

            guardarLocal();
            actualitzarInfo();
            renderitzar();
            mostrarGuardat(`${importades} importades`);
          } catch (err) {
            alert('Error important CSV: ' + err.message);
          }
        };
        reader.readAsText(file);
        fileInput.value = '';
      };
      fileInput.click();
    }
    
    function renderitzar() {
      const inici = (paginaActual - 1) * PER_PAGINA;

    function renderPaginacio(id) {
      const el = document.getElementById(id);

      // Construir el conjunt de pàgines a mostrar: primera, finestra al voltant de l'actual, i última
      const paginesSet = new Set();
      paginesSet.add(1);
      paginesSet.add(totalPagines);
      for (let i = Math.max(1, paginaActual - 2); i <= Math.min(totalPagines, paginaActual + 2); i++) {
        paginesSet.add(i);
      }
      const llista = [...paginesSet].sort((a, b) => a - b);

      let html = `<button onclick="anarPagina(${paginaActual - 1})" ${paginaActual === 1 ? 'disabled' : ''}>◀</button>`;

      let prev = 0;
      llista.forEach(p => {
        if (p - prev > 1) {
          html += `<span class="pag-ellipsis">…</span>`;
        }
        html += `<button class="${p === paginaActual ? 'actiu' : ''}" onclick="anarPagina(${p})">${p}</button>`;
        prev = p;
      });

      html += `<button onclick="anarPagina(${paginaActual + 1})" ${paginaActual === totalPagines ? 'disabled' : ''}>▶</button>`;

      el.innerHTML = html;
    }
    
    function anarPagina(p) {
      if (p >= 1 && p <= totalPagines) {
        paginaActual = p;
        renderitzar();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }
    
    function mostrarModal(nom) {
      document.getElementById('modalImg').src = 'webp/' + nom;
      document.getElementById('modal').classList.add('actiu');
    }
    
    function tancarModal() {
      document.getElementById('modal').classList.remove('actiu');
    }
    
    // Desar automàticament cada 30 segons
    setInterval(guardarLocal, 30000);
    
    // Funcions de filtratge per grups
    function toggleDropdown() {
      const menu = document.getElementById('filterMenu');
      const button = document.getElementById('filterButton');
      const isOpen = menu.classList.contains('open');

      document.querySelectorAll('.filter-menu').forEach(m => m.classList.remove('open'));
      document.querySelectorAll('.filter-button').forEach(b => b.classList.remove('open'));

      if (!isOpen) {
        menu.classList.add('open');
        button.classList.add('open');
        renderGrups();
      }
    }
    
    // Tancar dropdown si es clica fora
    
    function renderGrups(filtreText = '') {
      const container = document.getElementById('filterOptions');
      const grupsAMostrar = filtreText 
        ? grupsOrdenats.filter(g => g.toLowerCase().includes(filtreText.toLowerCase()))
        : grupsOrdenats;
      
      container.innerHTML = grupsAMostrar.map(grup => {
        const checked = grupsSeleccionats.has(grup) ? 'checked' : '';
        const count = grups[grup].length;
        return `
          <div class="filter-option">
            <input type="checkbox" id="grup_${grup}" ${checked} onchange="toggleGrup('${grup}')">
            <label for="grup_${grup}">
              <span>${grup}</span>
              <span class="count">${count}</span>
            </label>
          </div>
        `;
      }).join('');
    }
    
    function cercarGrup() {
      const text = document.getElementById('searchGrup').value;
      renderGrups(text);
    }
    
    function toggleGrup(grup) {
      if (grupsSeleccionats.has(grup)) {
        grupsSeleccionats.delete(grup);
      } else {
        grupsSeleccionats.add(grup);
      }
      aplicarFiltreGrups();
      actualitzarTextFiltre();
    }
    
    function seleccionarTots() {
      grupsSeleccionats = new Set(grupsOrdenats);
      renderGrups();
      aplicarFiltreGrups();
      actualitzarTextFiltre();
    }
    
    function deseleccionarTots() {
      grupsSeleccionats.clear();
      renderGrups();
      aplicarFiltreGrups();
      actualitzarTextFiltre();
    }
    
    function aplicarFiltreGrups() {
      aplicarFiltres();
    }

    function aplicarFiltres() {
      FILTRATS = PATRONS.filter(p => {
        const grupOk = grupsSeleccionats.has(obtenirGrup(p.nom));
        const campOk = (camp) => {
          const actiu = filtresCamps[camp].actiu;
          if (actiu === 'TOTS') return true;
          if (actiu === 'SENSE') return esSenseOMDesconegut(p[camp]);
          return p[camp] && p[camp].trim() === actiu;
        };
        return grupOk && campOk('tecnica') && campOk('motiu') && campOk('mida') && campOk('any') && campOk('autor');
      });
      paginaActual = 1;
      totalPagines = Math.ceil(FILTRATS.length / PER_PAGINA);
      actualitzarInfo();
      renderitzar();
    }
    
    function actualitzarTextFiltre() {
      const text = document.getElementById('filter-text');
      const seleccionats = grupsSeleccionats.size;
      const total = grupsOrdenats.length;
      
      if (seleccionats === 0) {
        text.textContent = 'Cap grup seleccionat';
      } else if (seleccionats === total) {
        text.textContent = 'Tots els grups';
      } else if (seleccionats === 1) {
        text.textContent = Array.from(grupsSeleccionats)[0];
      } else {
        text.textContent = `${seleccionats} grups seleccionats`;
      }
    }
    
    // ── Filtres de camps simples (any, tècnica, autor, col·lecció) ──
    function renderFiltreSimple(camp) {
      const cfg = filtresCamps[camp];
      const container = document.getElementById('filterOptions_' + camp);
      const valors = new Set();
      let hiHaSense = false;
      PATRONS.forEach(p => {
        if (!esSenseOMDesconegut(p[camp])) valors.add(p[camp].trim());
        else hiHaSense = true;
      });
      const valorsOrdenats = [...valors].sort();

      let html = `
        <div class="filter-option" onclick="seleccionarFiltre('${camp}','TOTS')">
          <label style="cursor:pointer;font-size:12px;display:flex;justify-content:space-between;align-items:center;">
            <span>${cfg.actiu === 'TOTS' ? '✓ ' : ''}${cfg.etiqueta}</span>
            <span class="count">${PATRONS.length}</span>
          </label>
        </div>`;

      valorsOrdenats.forEach(val => {
        const count = PATRONS.filter(p => p[camp] && p[camp].trim() === val).length;
        const valEsc = val.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        html += `
          <div class="filter-option" onclick="seleccionarFiltre('${camp}','${valEsc}')">
            <label style="cursor:pointer;font-size:12px;display:flex;justify-content:space-between;align-items:center;">
              <span>${cfg.actiu === val ? '✓ ' : ''}${val}</span>
              <span class="count">${count}</span>
            </label>
          </div>`;
      });

      if (hiHaSense) {
        const count = PATRONS.filter(p => esSenseOMDesconegut(p[camp])).length;
        html += `
          <div class="filter-option" onclick="seleccionarFiltre('${camp}','SENSE')">
            <label style="cursor:pointer;font-size:12px;display:flex;justify-content:space-between;align-items:center;">
              <span>${cfg.actiu === 'SENSE' ? '✓ ' : ''}${cfg.textBuit}</span>
              <span class="count">${count}</span>
            </label>
          </div>`;
      }

      container.innerHTML = html;
    }

    function toggleDropdownSimple(camp) {
      const menu = document.getElementById('filterMenu_' + camp);
      const button = document.getElementById('filterButton_' + camp);
      const isOpen = menu.classList.contains('open');

      document.querySelectorAll('.filter-menu').forEach(m => m.classList.remove('open'));
      document.querySelectorAll('.filter-button').forEach(b => b.classList.remove('open'));

      if (!isOpen) {
        renderFiltreSimple(camp);
        menu.classList.add('open');
        button.classList.add('open');
      }
    }

    function seleccionarFiltre(camp, valor) {
      filtresCamps[camp].actiu = valor;
      const text = document.getElementById('filter-text_' + camp);
      if (valor === 'TOTS') {
        const cfg = filtresCamps[camp];
        text.textContent = cfg.titolBreu != null ? cfg.titolBreu : cfg.etiqueta;
      } else if (valor === 'SENSE') {
        text.textContent = filtresCamps[camp].textBuit;
      } else {
        text.textContent = valor;
      }
      document.getElementById('filterMenu_' + camp).classList.remove('open');
      document.getElementById('filterButton_' + camp).classList.remove('open');
      aplicarFiltres();
    }

    // Tancar dropdowns en clicar fora
    function toggleAdminMenu() {
      document.getElementById('adminMenu').classList.toggle('open');
    }

    document.addEventListener('click', (e) => {
      document.querySelectorAll('.filter-dropdown').forEach(dd => {
        if (!dd.contains(e.target)) {
          dd.querySelector('.filter-menu')?.classList.remove('open');
          dd.querySelector('.filter-button')?.classList.remove('open');
        }
      });
      const wrap = document.querySelector('.admin-menu-wrap');
      if (wrap && !wrap.contains(e.target)) {
        document.getElementById('adminMenu')?.classList.remove('open');
      }
    });

    // Inicialitzar grups al carregar
    renderGrups();
    actualitzarTextFiltre();
    actualitzarInfo();
    renderitzar();
  </script>
</body>
</html>
